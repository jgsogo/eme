name = "openrouter"
client = "openai-compatible"
enabled = true
api_key_env = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api/v1"

[[models]]
name = "anthropic/claude-sonnet-4.5"
enabled = true
access_tier = "paid"
capabilities = ["chat", "reasoning", "coding", "tool_calling"]

# Free chat endpoints currently listed by OpenRouter (November 2026).
# Multimodal inputs and specialised non-chat endpoints are not advertised because
# the shared EME conversation request currently carries text only.

[[models]]
name = "baidu/ernie-5.5-flash-preview:free"
enabled = true
access_tier = "free"
capabilities = ["chat", "reasoning", "coding", "tool_calling"]

