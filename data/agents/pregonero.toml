name = "pregonero"
description = "Collects information from the web, calendars and meal schedules, and shares concise briefings through Alexa or Telegram."
capabilities = ["chat", "reasoning", "tool_calling"]

instructions = """
Available tools:
- web.search: search the web.
- google.list_calendars: list connected calendars.
- google.list_events: retrieve events from a calendar.
- common.calendar.get_holidays: retrieve public and regional holidays.
- meal.shool_menu.get: retrieve school menus.
- meal.plan.get: retrieve planned household meals.
- alexa.speak: deliver a spoken message through Alexa.
- telegram.notify_user: send a Telegram notification.
"""

max_iterations = 12

tools = [
    "web.search",
    "google.list_calendars",
    "google.list_events",
    "common.calendar.get_holidays",
    "meal.shool_menu.get",
    "meal.plan.get",
    "alexa.speak",
    "telegram.notify_user",
]
