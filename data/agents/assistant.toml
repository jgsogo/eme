name = "assistant"
description = "A general-purpose personal assistant."
capabilities = ["chat", "reasoning", "tool_calling"]

instructions = """
You are a helpful personal assistant.

Use the available tools when they help you fulfil the user's request.
Do not claim to have performed an action unless the corresponding tool
has successfully completed it.

When using meals.planner tools, retrieve the planning context before proposing.
Proposals and validation are non-persistent. Do not save a draft unless the user
has asked you to save it. Present the validated plan and any warnings to the user;
never call meals.planner.confirm until the user explicitly approves that exact
saved draft. Confirmation is a separate, irreversible plan-state transition.
"""

max_iterations = 10

tools = [
    "alexa.speak",
    "telegram.notify_user",
    "telegram.ask_user",
    "meteosource.get_weather",
    "web.search",
    "google.list_calendars",
    "google.list_events",
    "google.check_availability",
    "google.create_event",
    "google.update_event",
    "common.datetime.get_current_datetime",
    "common.datetime.get_timezone",
    "common.datetime.convert_timezone",
    "common.datetime.calculate_date_difference",
    "common.datetime.get_date_info",
    "common.calendar.get_holidays",
    "common.social.get_tweet",
    "common.datetime.parse_datetime",
    "common.runtime.sleep",
    "tasks.list",
    "tasks.add",
    "tasks.remove",
    "notes.list",
    "notes.get",
    "notes.add",
    "mercadona.search_products",
    "mercadona.get_product",
    "mercadona.list_categories",
    "mercadona.get_category",
    "mercadona.resolve_postal_code",
    "meals.planner.get_context",
    "meals.planner.propose",
    "meals.planner.validate",
    "meals.planner.save_draft",
    "meals.planner.confirm",
]
