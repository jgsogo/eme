name = "google.create_event"
description = "Create an event in a connected Google Calendar when the authenticated EME user has write access."
[parameters]
type = "object"
additionalProperties = false
required = ["calendar_id", "summary", "start", "end"]
[parameters.properties.calendar_id]
type = "string"
minLength = 1
description = "Internal EME connected-calendar ID returned by google.list_calendars."
[parameters.properties.summary]
type = "string"
minLength = 1
maxLength = 1024
description = "Event title."
[parameters.properties.description]
type = "string"
maxLength = 8192
description = "Optional event description."
[parameters.properties.location]
type = "string"
maxLength = 1024
description = "Optional event location."
[parameters.properties.start]
type = "string"
format = "date-time"
description = "Event start as an RFC 3339 timestamp with an explicit timezone."
[parameters.properties.end]
type = "string"
format = "date-time"
description = "Event end as an RFC 3339 timestamp with an explicit timezone."
