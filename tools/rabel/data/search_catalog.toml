name = "rabel.search_catalog"
description = "Search the Salamanca Public Library catalogue. Returns compact bibliographic matches; fetch one selected record for copy availability."

[parameters]
type = "object"
required = ["query"]
additionalProperties = false

[parameters.properties.query]
type = "string"
minLength = 1
description = "Title, author, ISBN or general catalogue search terms."

[parameters.properties.limit]
type = "integer"
minimum = 1
maximum = 20
default = 10
