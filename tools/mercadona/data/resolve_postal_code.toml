name = "mercadona.resolve_postal_code"
description = "Resolve a Spanish postal code to the Mercadona online-shop warehouse serving that area. Does not modify a customer account or delivery address."
[parameters]
type = "object"
required = ["postal_code"]
additionalProperties = false

[parameters.properties.postal_code]
type = "string"
pattern = "^[0-9]{5}$"
description = "Five-digit Spanish postal code."
