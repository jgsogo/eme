name = "mercadona.search_products"
description = "Search Mercadona's product catalogue by name or keywords. Returns product identifiers, names, packaging, prices, thumbnails and category information. Searches the configured warehouse catalogue."
[parameters]
type = "object"
required = ["query"]
additionalProperties = false

[parameters.properties.query]
type = "string"
minLength = 1
description = "Product name or search terms, for example leche entera, aceite de oliva or yogur natural."

[parameters.properties.limit]
type = "integer"
minimum = 1
maximum = 50
default = 10
description = "Maximum number of products to return. Defaults to 10."

[parameters.properties.warehouse]
type = "string"
description = "Optional Mercadona warehouse code. Defaults to MERCADONA_WAREHOUSE or mad1."
