name = "meals.plan.create"
description = "Create a weekly plan; week_start must be Monday."

[parameters]
type = "object"
additionalProperties = false
required = ["week_start", "assignments"]

[parameters.properties]
week_start = {type="string",format="date"}
assignments = {type="array",items={type="object",required=["id","date","meal_type","participants"],properties={id={type="integer",minimum=1},date={type="string",format="date"},meal_type={type="string",enum=["breakfast","lunch","dinner"]},participants={type="array",minItems=1,items={type="object",required=["member_id","name"],properties={member_id={type="integer",minimum=1},name={type="string"}}}},recipe_ids={type="array",items={type="integer",minimum=1}}}}}
