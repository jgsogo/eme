name = "meals.school_menu.update"
description = "Replace an existing school menu. If status is `closed`, the tool discards any supplied items and stores an empty menu; put the closure reason in notes. Otherwise, only status `known` may contain menu items."

[parameters]
type = "object"
additionalProperties = false
required = ["date", "status", "items"]

[parameters.properties]
date = {type="string",format="date"}
status = {type="string",enum=["known","not_published","closed","unknown"]}
items = {type="array",items={type="object",required=["name"],properties={name={type="string"},notes={type="string"},allergens={type="array",items={type="string"}},dietary_alternatives={type="array",items={type="string"}}}}}
notes = {type="string"}
