name = "meals.participation.set_exception"
description = "Set or replace a one-day participation exception for a family member's lunch or dinner. Use home, school, away, or not_participating. Read meals.plan.get_context first to resolve member IDs and current arrangements."

[parameters]
type = "object"
additionalProperties = false
required = ["member_id", "date", "meal_type", "arrangement"]

[parameters.properties]
member_id = { type = "integer", minimum = 1 }
date = { type = "string", format = "date" }
meal_type = { type = "string", enum = ["lunch", "dinner"] }
arrangement = { type = "string", enum = ["home", "school", "away", "not_participating"] }
