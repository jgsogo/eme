name = "alexa_speak"
description = """Send a text message to an Alexa device, preceded by an optional sound effect.

Supported sounds (choose one exact URI):
- Default short beep: soundbank://soundlibrary/computers/beeps_tones/beeps_tones_06
- Futuristic effect: soundbank://soundlibrary/aircrafts/futuristic/futuristic_01
- Steam sound: soundbank://soundlibrary/air/steam/steam_05
- Water/nature sound: soundbank://soundlibrary/water/nature/nature_08
- Bird chirp: soundbank://soundlibrary/animals/amzn_sfx_bird_chickadee_chirp_1x_01
- Forest birds: soundbank://soundlibrary/animals/amzn_sfx_bird_forest_01
- Robin chirp: soundbank://soundlibrary/animals/amzn_sfx_bird_robin_chirp_1x_01
- Raven call: soundbank://soundlibrary/animals/amzn_sfx_raven_caw_1x_01

Omit chime to use the default short beep. The JSON schema accepts only the URIs listed above.

To browse, preview, and copy additional sound URIs, use the official Alexa Skills Kit Sound Library:
https://developer.amazon.com/en-US/docs/alexa/custom-skills/ask-soundlibrary.html
The complete catalogue is larger than this tool's allowlist. Add a sound to the allowlist and JSON schema enum before using it here."""

[parameters]
type = "object"
required = ["text"]
additionalProperties = false

[parameters.properties.text]
type = "string"
description = "The text to send to the Alexa device."

[parameters.properties.chime]
type = "string"
description = "Optional Alexa soundbank URI to play before speaking. If omitted, the default notification chime is used. Example: soundbank://soundlibrary/alarms/beeps_and_bloops/bell_01"
enum = [
  "soundbank://soundlibrary/computers/beeps_tones/beeps_tones_06",
  "soundbank://soundlibrary/aircrafts/futuristic/futuristic_01",
  "soundbank://soundlibrary/air/steam/steam_05",
  "soundbank://soundlibrary/water/nature/nature_08",
  "soundbank://soundlibrary/animals/amzn_sfx_bird_chickadee_chirp_1x_01",
  "soundbank://soundlibrary/animals/amzn_sfx_bird_forest_01",
  "soundbank://soundlibrary/animals/amzn_sfx_bird_robin_chirp_1x_01",
  "soundbank://soundlibrary/animals/amzn_sfx_raven_caw_1x_01"
]
