name = "telegram.notify_user"
description = "Send a one-way Telegram notification to the conversation owner or a member of any family the conversation owner belongs to. Does not wait for a reply."

[parameters]
type = "object"
required = ["message"]
additionalProperties = false

[parameters.properties.recipient]
type = "string"
description = "Optional recipient_id from any trusted family context belonging to the conversation owner. Omit to notify the conversation owner."

[parameters.properties.message]
type = "string"
description = "The notification text to send to the user."
