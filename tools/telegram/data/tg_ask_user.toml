name = "tg_ask_user"
description = "Ask the conversation owner or a selected family member a question and wait for their Telegram reply. Use kind='text' for free-text answers, or kind='yes_no' for a Yes/No choice presented as inline buttons. Returns the user's answer (free text, or 'yes'/'no')."

[parameters]
type = "object"
required = ["question"]
additionalProperties = false

[parameters.properties.question]
type = "string"
description = "The question to show the user."

[parameters.properties.recipient]
type = "string"
description = "Optional recipient_id from the trusted family context. Omit to ask the conversation owner."

[parameters.properties.kind]
type = "string"
description = "Answer mode: 'text' (default) for free-text reply, or 'yes_no' for Yes/No buttons."
enum = ["text", "yes_no"]
