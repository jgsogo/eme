name = "telegram.ask_user"
description = "Ask the conversation owner or a member of any family the conversation owner belongs to a question and wait for their Telegram reply (default timeout: 5 minutes). The recipient must use Telegram's Reply action on the question message; standalone messages/comments are not accepted. Use kind='text' for free-text answers, or kind='yes_no' for a yes/no text reply. Returns the user's answer (free text, or 'yes'/'no')."

[parameters]
type = "object"
required = ["question"]
additionalProperties = false

[parameters.properties.question]
type = "string"
description = "The question to show the user."

[parameters.properties.recipient]
type = "string"
description = "Optional recipient_id from any trusted family context belonging to the conversation owner. Omit to ask the conversation owner."

[parameters.properties.kind]
type = "string"
description = "Answer mode: 'text' (default) for a free-text reply, or 'yes_no' for a yes/no text reply to the question message."
enum = ["text", "yes_no"]
