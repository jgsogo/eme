[workspace]
resolver = "3"
members = [
    "agent-config",
    "agent-models",
    "agent-runtime",
    "agent-service",
    "agent-storage",
    "agent-server",
    "agent-metering",
    "tools/alexa",
    "tools/telegram",
    "tools/meteosource",
    "tools/google",
    "tools/tavily",
    "tools/common",
    "tools/tasks",
    "tools/notes",
    "tools/meal-planner",
    "tools/mercadona",
    "tools/media",
    "tools/rabel",
]

[workspace.dependencies]
thiserror = "2"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0.104"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.12", features = ["json", "cookies","rustls-tls"] }
base64 = "0.22"
oauth2 = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
jsonschema = "0.61"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
sha2 = "0.11"
rusqlite = { version = "0.43", features = ["bundled"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.17"

# Test dependencies
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
