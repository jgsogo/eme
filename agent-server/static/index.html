<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EME Agent Console</title>
<style>
:root{color-scheme:dark;--bg:#0f1419;--panel:#1a2332;--panel2:#243044;--border:#2d3a4f;--text:#e7ecf3;--muted:#8b9bb4;--accent:#68a9dc;--ok:#55b889;--err:#d47777;--radius:12px;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
header{padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}h1{font-size:18px;margin:0}button,select,textarea{font:inherit;color:inherit}button{background:var(--accent);color:#101923;border:0;border-radius:8px;padding:9px 13px;font-weight:650;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:var(--panel2);border:1px solid var(--border);color:var(--text)}button.danger{background:transparent;border:1px solid var(--err);color:var(--err)}
main{display:grid;grid-template-columns:310px minmax(0,1fr);gap:14px;padding:14px;min-height:0;flex:1;max-width:1500px;width:100%;margin:auto}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);min-height:0;overflow:hidden}.sidebar{display:flex;flex-direction:column;padding:14px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
select,textarea{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px;margin:6px 0 12px}label{font-size:12px;color:var(--muted)}.agent-desc{font-size:12px;color:var(--muted);margin:-6px 0 12px}
.conversations{overflow:auto;list-style:none;margin:0;padding:0}.conversations li{padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:7px;cursor:pointer;background:var(--panel2)}.conversations li.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.conv-title{font-weight:600;overflow:hidden;text-overflow:ellipsis}.conv-meta{font-size:11px;color:var(--muted);margin-top:3px}
.chat{display:flex;flex-direction:column}.chat-head{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px}.chat-head h2{color:var(--text);font-size:14px;letter-spacing:0;text-transform:none}.chat-head small{color:var(--muted)}
.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:13px}.empty{color:var(--muted);text-align:center;margin:auto;padding:30px}.message{max-width:min(820px,90%);border:1px solid var(--border);border-radius:12px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{align-self:flex-end;background:#20374a;border-color:#355b78}.message.assistant{align-self:flex-start;background:var(--panel2)}.message.tool{align-self:flex-start;background:#171e29;color:#b7c3d4;font:12px/1.5 ui-monospace,monospace;max-width:95%}.message .role{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}.composer{border-top:1px solid var(--border);padding:13px 16px}.composer textarea{resize:vertical;min-height:65px;max-height:180px;margin:0 0 8px}.composer-row{display:flex;justify-content:space-between;align-items:center;gap:10px}.hint{font-size:11px;color:var(--muted)}.run-status{font-size:12px;color:var(--muted)}.run-status.error{color:var(--err)}.run-status.ok{color:var(--ok)}
@media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.sidebar{max-height:260px}.conversations{display:flex;gap:8px}.conversations li{min-width:190px}.chat{min-height:450px}.message{max-width:96%}}
</style>
</head>
<body>
<header><h1>EME Agent Console</h1><span id="connection" class="hint">Connecting…</span></header>
<main>
<aside class="panel sidebar">
  <div class="toolbar"><h2>Conversations</h2><button class="secondary" id="refresh">Refresh</button></div>
  <label for="agent">Agent for new conversation</label><select id="agent"></select><div id="agent-desc" class="agent-desc"></div>
  <button id="new-conversation" style="width:100%;margin-bottom:16px">＋ New conversation</button>
  <ul class="conversations" id="conversations"></ul>
</aside>
<section class="panel chat">
  <div class="chat-head"><div><h2 id="conversation-title">No conversation selected</h2><small id="conversation-meta">Create a conversation to get started</small></div><div class="run-status" id="run-status"></div></div>
  <div class="messages" id="messages"><div class="empty">Choose an existing conversation or create a new one.</div></div>
  <form class="composer" id="composer">
    <textarea id="prompt" placeholder="Write a message…" disabled></textarea>
    <div class="composer-row"><span class="hint">Enter to send · Shift+Enter for a new line</span><button id="send" disabled>Send message</button></div>
  </form>
</section>
</main>
<script>
const TERMINAL=new Set(["completed","failed","cancelled","timed_out","max_iterations_reached"]);
const state={agents:[],conversations:[],selected:null,runId:null,pollTimer:null};
const $=id=>document.getElementById(id);
async function api(path,options={}){const response=await fetch(path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});const raw=await response.text();let body=null;try{body=raw?JSON.parse(raw):null}catch{body=raw}if(!response.ok)throw new Error(typeof body==="string"?body:body?.error||response.statusText);return body}
function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function setStatus(message,kind=""){const node=$("run-status");node.textContent=message;node.className="run-status "+kind}
function renderAgents(){const previous=$("agent").value;$("agent").innerHTML=state.agents.map(a=>'<option value="'+escapeHtml(a.name)+'">'+escapeHtml(a.name)+'</option>').join("");if(state.agents.some(a=>a.name===previous))$("agent").value=previous;updateAgentDescription()}
function updateAgentDescription(){const a=state.agents.find(x=>x.name===$("agent").value);$("agent-desc").textContent=a?[a.model,(a.tools||[]).length+" tools",a.description].filter(Boolean).join(" · "):""}
function renderConversations(){$("conversations").innerHTML=state.conversations.length?state.conversations.map(c=>'<li data-id="'+escapeHtml(c.id)+'" class="'+(c.id===state.selected?"active":"")+'"><div class="conv-title">'+escapeHtml(c.agent)+'</div><div class="conv-meta">'+new Date(c.updated_at).toLocaleString()+' · '+c.message_count+' messages</div></li>').join():'<li style="cursor:default;color:var(--muted)">No conversations yet.</li>'}
function messageParts(message){if(!message||typeof message!=="object")return null;const [kind,value]=Object.entries(message)[0]||[];if(!kind)return null;return {kind:kind.toLowerCase(),value:value||{}}}
function renderMessages(messages=[]){const rendered=[];for(const message of messages){const part=messageParts(message);if(!part)continue;const {kind,value}=part;if(kind==="user")rendered.push('<article class="message user"><div class="role">You</div>'+escapeHtml(value.content)+'</article>');else if(kind==="assistant"){if(value.content)rendered.push('<article class="message assistant"><div class="role">Assistant</div>'+escapeHtml(value.content)+'</article>');for(const call of value.tool_calls||[])rendered.push('<article class="message tool"><div class="role">Tool call · '+escapeHtml(call.name)+'</div>'+escapeHtml(JSON.stringify(call.arguments,null,2))+'</article>')}else if(kind==="tool")rendered.push('<article class="message tool"><div class="role">Tool result · '+escapeHtml(value.name)+(value.is_error?" · error":"")+'</div>'+escapeHtml(value.content)+'</article>')}
$("messages").innerHTML=rendered.length?rendered.join(""):'<div class="empty">Send the first message to begin this conversation.</div>';$("messages").scrollTop=$("messages").scrollHeight}
function setComposerEnabled(enabled){$("prompt").disabled=!enabled||!!state.runId;$("send").disabled=!enabled||!!state.runId}
async function loadConversations(){state.conversations=await api("/conversations");renderConversations()}
async function selectConversation(id){state.selected=id;renderConversations();$("messages").innerHTML='<div class="empty">Loading conversation…</div>';try{const c=await api("/conversations/"+encodeURIComponent(id));$("conversation-title").textContent=c.agent;$("conversation-meta").textContent="Conversation "+c.id;$("agent").value=c.agent;updateAgentDescription();renderMessages(c.messages);setComposerEnabled(true);setStatus("")}catch(e){setStatus(e.message,"error")}}
async function createConversation(){const agent=$("agent").value;if(!agent)return;try{const c=await api("/conversations",{method:"POST",body:JSON.stringify({agent})});await loadConversations();await selectConversation(c.id);$("prompt").focus()}catch(e){setStatus(e.message,"error")}}
async function sendMessage(){const input=$("prompt").value.trim();if(!input||!state.selected||state.runId)return;const id=state.selected;$("prompt").value="";setComposerEnabled(false);setStatus("Queued…");try{const result=await api("/conversations/"+encodeURIComponent(id)+"/runs",{method:"POST",body:JSON.stringify({input})});state.runId=result.run_id;setStatus("Running · "+result.run_id.slice(0,8));await pollRun(id,result.run_id)}catch(e){setStatus(e.message,"error");setComposerEnabled(true);$("prompt").value=input}}
async function pollRun(conversationId,runId){clearInterval(state.pollTimer);const poll=async()=>{try{const run=await api("/runs/"+encodeURIComponent(runId));if(!TERMINAL.has(run.status)){setStatus("Running · "+run.status);return}clearInterval(state.pollTimer);state.runId=null;await selectConversation(conversationId);await loadConversations();if(run.status==="completed")setStatus("Completed","ok");else setStatus(run.error||run.status,"error");setComposerEnabled(state.selected===conversationId)}catch(e){clearInterval(state.pollTimer);state.runId=null;setStatus("Unable to retrieve run: "+e.message,"error");setComposerEnabled(true)}};await poll();if(state.runId)state.pollTimer=setInterval(poll,1000)}
$("agent").addEventListener("change",updateAgentDescription);$("new-conversation").addEventListener("click",createConversation);$("refresh").addEventListener("click",()=>loadConversations().catch(e=>setStatus(e.message,"error")));$("conversations").addEventListener("click",e=>{const item=e.target.closest("li[data-id]");if(item&&!state.runId)selectConversation(item.dataset.id)});$("composer").addEventListener("submit",e=>{e.preventDefault();sendMessage()});$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("composer").requestSubmit()}}); 
(async()=>{try{state.agents=await api("/agents");renderAgents();await loadConversations();$("connection").textContent="Connected";if(state.conversations.length)await selectConversation(state.conversations[0].id)}catch(e){$("connection").textContent="Connection failed";setStatus(e.message,"error")}})();
</script>
</body></html>
