<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Admin · Providers · EME</title>
  <link rel="stylesheet" href="/assets/console.css">
  <link rel="stylesheet" href="/assets/usage.css">
  <style>
    .provider-card{padding:0;overflow:hidden}
    .provider-card-header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 20px;border-bottom:1px solid var(--border)}
    .provider-card-identity{min-width:0}
    .provider-card-kicker{display:block;margin-bottom:5px;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.09em}
    .provider-card-identity h3{margin:0 0 8px;font-size:17px;overflow-wrap:anywhere}
    .provider-card-identity p{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0}
    .provider-field-label{color:var(--muted);font-size:11px;font-weight:650}
    .provider-client-name{font-size:13px;font-weight:600;overflow-wrap:anywhere}
    .provider-card-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex:none}
    .provider-models-count,.provider-model-count{display:inline-flex;align-items:center;min-height:26px;padding:3px 9px;border:1px solid var(--border);border-radius:20px;color:var(--muted);font-size:11px;font-weight:650;white-space:nowrap}
    .provider-test-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:7px 11px;white-space:nowrap}
    .provider-test-button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .provider-model-list{display:grid;gap:10px;padding:14px}
    .provider-model{min-width:0;padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--panel2)}
    .provider-model-header{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .provider-model-test-group{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0}
    .provider-model-test-group .provider-test-button{flex:none}
    .provider-model-test-group .provider-model-result{flex:1 1 auto;align-items:center;margin:0;min-width:0;max-width:min(52%,520px);overflow-wrap:anywhere}
    .provider-model-test-group .provider-model-result.pending{flex-basis:auto}
    .provider-model-test-group .provider-model-result p{flex-basis:auto}
    .provider-model-test-group .provider-test-diagnostics{flex-basis:100%}
    .provider-model-identity{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-width:0}
    .provider-model-identity h4{margin:0;font-size:14px;overflow-wrap:anywhere}
    .provider-model-count{min-height:22px;padding:2px 8px;font-size:10px}
    .provider-capabilities{display:grid;gap:7px;margin-top:12px}
    .provider-capability-list{display:flex;flex-wrap:wrap;gap:6px}
    .provider-capability{display:inline-flex;align-items:center;min-height:25px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px;line-height:1.3}
    .provider-no-capabilities,.provider-no-models{margin:0;color:var(--muted);font-size:12px}
    .provider-model-result{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12px}
    .provider-model-result p{flex-basis:100%;margin:0;overflow-wrap:anywhere;color:var(--muted)}
    .provider-model-result.success strong{color:var(--success,#25865a)}
    .provider-model-result.error strong,.provider-model-result.error{color:var(--danger,#b54747)}
    .provider-model-result.pending{color:var(--muted)}
    .provider-model-result:empty{display:none}
    .provider-test-diagnostics{flex-basis:100%;min-width:0}
    .provider-test-diagnostics pre{max-width:100%;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
    @media(max-width:600px){
      .provider-card-header{align-items:stretch;flex-direction:column;gap:13px;padding:15px}
      .provider-card-actions{justify-content:space-between;flex-wrap:wrap}
      .provider-model-list{padding:10px}
      .provider-model{padding:12px}
      .provider-model-header{align-items:flex-start;flex-direction:column}
      .provider-model-header .provider-model-test-group{width:100%;justify-content:flex-start;flex-wrap:wrap}
      .provider-model-test-group .provider-model-result{max-width:100%;flex:1 1 180px}
    }
  </style>
  <script src="/assets/desktop-header.js" defer></script>
  <script src="/assets/console-auth.js" defer></script>
  <script src="/assets/providers.js" defer></script>
</head>
<body data-page="admin-providers">
  <header></header>
  <main class="console-main usage-main">
    <nav class="profile-section-nav admin-section-nav" aria-label="Admin">
      <a class="profile-section-link" href="/console/admin/usage">Observability</a>
      <a class="profile-section-link" href="/console/admin/tools">Tools</a>
      <a class="profile-section-link" href="/console/admin/agents">Agents</a>
      <a class="profile-section-link active" href="/console/admin/providers" aria-current="page">Providers</a>
    </nav>
    <div class="usage-heading">
      <div>
        <p class="eyebrow">MODEL REGISTRY</p>
        <h2>Configured providers</h2>
        <p class="usage-intro">Providers and models declared in the platform's loaded model registry.</p>
      </div>
      <div class="usage-actions">
        <label for="providers-search">Filter providers and models</label>
        <input id="providers-search" type="search" placeholder="Provider, model or capability" autocomplete="off">
        <button class="secondary" id="providers-refresh" type="button">Refresh</button>
      </div>
    </div>
    <p id="providers-status" class="usage-status" role="status">Loading configured providers…</p>
    <section id="providers-list" class="tools-grid" aria-live="polite">
      <p class="usage-empty">Loading…</p>
    </section>
  </main>
</body>
</html>
