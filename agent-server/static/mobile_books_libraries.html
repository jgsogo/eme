<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>EME · Preferred libraries</title><link rel="stylesheet" href="/assets/mobile-base.css"><link rel="stylesheet" href="/assets/mobile.css"><script src="/assets/console-auth.js" defer></script><script src="/assets/libraries.js" defer></script><script src="/assets/mobile.js" defer></script><style>
.libraries-view{padding:12px;overflow:auto}.libraries-panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}.libraries-panel input{width:100%;margin:5px 0 12px;padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);color:var(--text)}.library-choice{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--border)}.library-choice input{width:auto;margin:0}.library-list{max-height:60vh;overflow:auto}.library-tree-toggle{flex:0 0 24px;width:24px;min-width:24px;padding:2px 0;margin:0;text-align:center;line-height:1.2}.library-tree-spacer{display:inline-block;flex:0 0 24px;width:24px}.library-choice{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--border)}.library-choice input{flex:0 0 auto;width:auto;margin:0}.libraries-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.muted,.libraries-status{color:var(--muted)}.profile-section-nav{display:flex;align-items:center;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--border)}.profile-section-link{display:inline-block;padding:7px 11px;border-radius:7px;text-decoration:none;color:var(--muted);font-size:13px}.profile-section-link.active{background:var(--panel2);color:var(--text)}</style></head>
<body data-layout="mobile" data-page="books-libraries"><span id="connection" class="hint" hidden>Connecting…</span><main class="libraries-view"><nav class="books-section-nav" aria-label="Book collection">
<a class="books-section-link" href="/mobile/books">My books</a>
<a class="books-section-link active" href="/mobile/books/libraries" aria-current="page">Preferred libraries</a>
</nav>
<div class="libraries-heading"><div><p class="eyebrow">MY COLLECTION</p><h2>Preferred libraries</h2><p class="muted">Select the RABEL libraries to check when looking for copies of books in your collection.</p></div><button id="libraries-refresh" class="secondary" type="button">↻ Refresh</button></div>
<p id="libraries-refreshed" class="muted" aria-live="polite">Libraries have not been refreshed yet.</p>
<section class="libraries-panel"><label for="libraries-search">Search libraries</label><input id="libraries-search" type="search" placeholder="Filter by library name or location">
<p id="libraries-count" class="muted">Loading libraries…</p><div id="library-options" class="library-list" aria-live="polite"></div>
<div class="libraries-actions"><button id="libraries-save" type="button">Save preferences</button></div><p id="libraries-status" class="libraries-status" role="status"></p></section></main></body></html>
