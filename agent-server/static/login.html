<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sign in · EME</title>
  <link rel="stylesheet" href="/assets/console.css">
  <script src="/assets/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-page-main">
    <section class="login-card" aria-labelledby="login-title">
      <h2 id="login-title">Sign in with Telegram</h2>
      <p>Use your Telegram account to sign in to the EME web console.</p>
      <button id="login-start" type="button">Continue with Telegram</button>
      <a id="login-link" hidden target="_blank" rel="noopener noreferrer">Open EME bot in Telegram</a>
      <p id="login-status" role="status" aria-live="polite">Your login link will expire after five minutes.</p>
    </section>
  </main>
</body>
</html>
