<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>EME Agent Console · Meal planner</title><link rel="stylesheet" href="/assets/mobile-base.css"><link rel="stylesheet" href="/assets/mobile.css"><style>
.recipe-picker{margin:4px 0 16px;min-width:0}.recipe-picker-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}.recipe-picker-heading label{font-size:12px;color:var(--muted)}.recipe-search{display:block;width:100%;height:42px;margin:0 0 5px;padding:9px 12px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;font:inherit}.recipe-search:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.recipe-search-results{min-height:16px;margin:0 0 5px}.recipe-options{display:grid;gap:3px;max-height:230px;overflow-y:auto;padding:4px;border:1px solid var(--border);border-radius:9px;background:var(--bg)}.recipe-option{display:flex;align-items:center;gap:10px;min-width:0;padding:9px 10px;border-radius:6px;color:var(--text);font-size:13px;cursor:pointer}.recipe-option:hover{background:var(--panel2)}.recipe-option.selected{background:rgba(104,169,220,.12)}.recipe-option input{width:17px;height:17px;flex:none;margin:0;accent-color:var(--accent)}.recipe-option span{min-width:0;overflow-wrap:anywhere}.recipe-selection-empty{margin:8px 2px;text-align:center}.recipe-picker>.hint{display:block;margin:7px 0 0}
</style><script src="/assets/console-auth.js" defer></script><script src="/assets/mobile.js" defer></script><script src="/assets/meals-family.js" defer></script><script src="/assets/weekly-planner.js" defer></script></head>
<body data-layout="mobile" data-page="meals"><main class="meal-planner-page"><div class="meals-workspace">
<div class="drawer-backdrop meals-drawer-backdrop" id="meals-drawer-backdrop" aria-hidden="true"></div>
<aside class="panel sidebar meals-sidebar" id="meals-sidebar" aria-label="Meals navigation">
 <div class="toolbar"><h2>Meals</h2><button class="secondary" id="close-meals" type="button" aria-label="Close Meals menu">✕</button></div>
 <nav class="meals-drawer-nav" aria-label="Meals">
  <a href="/mobile/meals" data-meals-destination="recipes">Recipes</a>
  <a href="/mobile/meal-planner" data-meals-destination="planner" class="active" aria-current="page">Planner</a>
  <a href="/mobile/shopping-list" data-meals-destination="shopping">Shopping</a>
  <a href="/mobile/school-menus" data-meals-destination="school">School</a>
 </nav>
</aside>
<div class="meals-main-panel">
 <div class="meals-main-heading">
  <button type="button" class="secondary menu-toggle" id="open-meals" aria-label="Open Meals menu" aria-controls="meals-sidebar" aria-expanded="false">☰</button>
  <div><h2>Planner</h2><p class="hint">Plan meals for your family.</p></div>
  <div id="meals-family-selector" class="meals-family-selector"></div>
 </div>

<section class="panel recipe-main school-menu-main"><div class="planner-toolbar school-menu-toolbar"><div class="planner-week-controls"><button id="previous-month" class="secondary" type="button" aria-label="Previous month">←</button><label>Month <input id="month-date" type="month" lang="en-GB" aria-label="Select month"></label><button id="next-month" class="secondary" type="button" aria-label="Next month">→</button></div><label class="school-menu-weekends-toggle"><input id="show-weekends" type="checkbox" checked> Show weekends</label><span id="plan-status" class="hint" aria-live="polite"></span></div><div id="planner-month-view" aria-live="polite"><p class="empty">Loading meal planner…</p></div></section>
<dialog id="assignment-editor" class="modal-dialog assignment-editor" aria-labelledby="editor-title"><div class="editor-heading"><h2 id="editor-title">Plan meal</h2><button id="close-editor" class="secondary" type="button">Close</button></div><form id="assignment-form" class="recipe-form"><div class="recipe-grid"><label>Date<input id="assignment-date" type="date" required></label><label>Meal<select id="assignment-meal"><option value="lunch">Lunch</option><option value="dinner">Dinner</option></select></label></div><label>Family members<select id="assignment-participants" multiple required size="5"></select></label><section class="recipe-picker" aria-labelledby="recipe-picker-label"><div class="recipe-picker-heading"><label id="recipe-picker-label" for="recipe-search">Recipes</label><span id="recipe-selection-count" class="hint" aria-live="polite">0 selected</span></div><input id="recipe-search" class="recipe-search" type="search" placeholder="Search recipes…" autocomplete="off"><p id="recipe-search-results" class="hint recipe-search-results" aria-live="polite"></p><div id="assignment-recipes-list" class="recipe-options" aria-label="Available recipes"></div><p id="recipe-selection-empty" class="hint recipe-selection-empty" hidden>No recipes match your search.</p><p class="hint">Select one or more recipes. Your selections stay selected while you search.</p></section><div class="recipe-actions"><button type="submit">Save meal</button><button id="remove-assignment" class="danger" type="button" hidden>Remove meal</button></div><p id="assignment-error" class="hint" role="status"></p></form></dialog></div></div></main></body></html>
