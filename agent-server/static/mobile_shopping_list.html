<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>EME Agent Console · Shopping list</title><link rel="stylesheet" href="/assets/mobile-base.css"><script src="/assets/console-auth.js" defer></script><script src="/assets/mobile.js" defer></script><script src="/assets/meals-family.js" defer></script><script src="/assets/shopping-list.js" defer></script></head>
<body data-layout="mobile"><header><div class="header-title"><h1>EME</h1><nav class="main-nav" aria-label="Main navigation"><a class="main-nav-link" href="/mobile/conversations">Chats</a><a class="main-nav-link" href="/mobile/notes">Notes</a><a class="main-nav-link" href="/mobile/tasks">Tasks</a><a class="main-nav-link active" href="/mobile/meals" aria-current="page">Meals</a></nav></div><div class="header-actions"><a class="profile-link" href="/mobile/profile" aria-label="Profile" title="Profile">◎</a><button class="secondary" id="logout" hidden>Sign out</button><span id="connection" class="hint">Connecting…</span></div></header>
<main class="meal-planner-page" hidden><div class="meals-header-row"><div id="meals-family-selector" class="meals-family-selector"></div><nav class="profile-section-nav meals-section-nav" aria-label="Meals"><a class="profile-section-link " href="/mobile/meals" >Recipes</a><a class="profile-section-link " href="/mobile/meal-planner" >Planner</a><a class="profile-section-link active" href="/mobile/shopping-list" aria-current="page">Shopping</a><a class="profile-section-link " href="/mobile/school-menus" >School</a></nav></div>
<section class="panel recipe-main shopping-list-main"><div class="shopping-list-toolbar"><div class="shopping-list-controls"><label class="shopping-list-field"><span>Starting week</span><input id="shopping-start" type="date" required></label><label class="shopping-list-field"><span>Duration</span><select id="shopping-weeks"><option value="1" selected>1 week</option><option value="2">2 weeks</option><option value="3">3 weeks</option><option value="4">4 weeks</option><option value="5">5 weeks</option><option value="6">6 weeks</option><option value="8">8 weeks</option></select></label><button id="shopping-refresh" type="button">Update list</button><button id="shopping-restore-all" class="secondary" type="button" disabled>Restore all items</button></div><div id="shopping-range" class="shopping-list-range hint" aria-live="polite"></div></div><div id="shopping-content" aria-live="polite"><p class="empty">Loading shopping list…</p></div></section></main></body></html>
