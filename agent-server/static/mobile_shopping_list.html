<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>EME Agent Console · Shopping list</title><link rel="stylesheet" href="/assets/mobile-base.css"><link rel="stylesheet" href="/assets/mobile.css"><script src="/assets/console-auth.js" defer></script><script src="/assets/mobile.js" defer></script><script src="/assets/meals-family.js" defer></script><script src="/assets/shopping-list.js" defer></script></head>
<body data-layout="mobile" data-page="meals"><main class="meal-planner-page" hidden><div class="meals-workspace">
<div class="drawer-backdrop meals-drawer-backdrop" id="meals-drawer-backdrop" aria-hidden="true"></div>
<aside class="panel sidebar meals-sidebar" id="meals-sidebar" aria-label="Meals navigation">
 <div class="toolbar"><h2>Meals</h2><button class="secondary" id="close-meals" type="button" aria-label="Close Meals menu">✕</button></div>
 <nav class="meals-drawer-nav" aria-label="Meals">
  <a href="/mobile/meals" data-meals-destination="recipes">Recipes</a>
  <a href="/mobile/meal-planner" data-meals-destination="planner">Planner</a>
  <a href="/mobile/shopping-list" data-meals-destination="shopping">Shopping</a>
  <a href="/mobile/school-menus" data-meals-destination="school">School</a>
 </nav>
</aside>
<div class="meals-main-panel">
 <div class="meals-main-heading">
  <button type="button" class="secondary menu-toggle" id="open-meals" aria-label="Open Meals menu" aria-controls="meals-sidebar" aria-expanded="false">☰</button>
  <div><h2>Shopping</h2><p class="hint">Manage your shopping list.</p></div>
  <div id="meals-family-selector" class="meals-family-selector"></div>
 </div>

<section class="panel recipe-main shopping-list-main"><div class="shopping-list-toolbar"><div class="shopping-list-controls"><label class="shopping-list-field"><span>Starting week</span><input id="shopping-start" type="date" required></label><label class="shopping-list-field"><span>Duration</span><select id="shopping-weeks"><option value="1" selected>1 week</option><option value="2">2 weeks</option><option value="3">3 weeks</option><option value="4">4 weeks</option><option value="5">5 weeks</option><option value="6">6 weeks</option><option value="8">8 weeks</option></select></label><button id="shopping-refresh" type="button">Update list</button><button id="shopping-restore-all" class="secondary" type="button" disabled>Restore all items</button></div><div id="shopping-range" class="shopping-list-range hint" aria-live="polite"></div></div><div id="shopping-content" aria-live="polite"><p class="empty">Loading shopping list…</p></div></section></div></div></main></body></html>
