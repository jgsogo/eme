<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>EME · My books</title><link rel="stylesheet" href="/assets/console.css"><script src="/assets/desktop-header.js" defer></script><script src="/assets/console-auth.js" defer></script><script src="/assets/books.js" defer></script><style>
.books-page{max-width:1200px;margin:24px auto;padding:0 18px}.books-grid{display:grid;grid-template-columns:minmax(250px, .8fr) minmax(0,1.6fr);gap:18px}.books-panel{background:var(--panel,#1a2332);border:1px solid var(--border,#2d3a4f);border-radius:12px;padding:16px;min-width:0}.books-panel h2{margin:0 0 12px}.books-panel input,.books-panel select,.books-panel textarea{width:100%;margin:5px 0 12px;padding:9px;border:1px solid var(--border,#2d3a4f);border-radius:8px;background:var(--panel2,#243044);color:var(--text,#e7ecf3)}.books-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.books-row>*{flex:1}.book-entry,.catalogue-entry,.holding{border:1px solid var(--border,#2d3a4f);border-radius:8px;padding:10px;margin:8px 0}.book-entry{cursor:pointer}.book-entry.active{border-color:var(--accent,#68a9dc)}.book-entry small,.muted{color:var(--muted,#8b9bb4)}.books-actions{display:flex;gap:8px;margin-top:12px}.books-actions button{padding:8px 12px}.library-option{display:flex;gap:8px;align-items:center;margin:6px 0}.library-option input{width:auto;margin:0}.books-status{min-height:1.5em;color:var(--muted,#8b9bb4)}.holdings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}@media(max-width:760px){.books-grid{grid-template-columns:1fr}.books-page{padding:0 10px;margin:12px auto}}
</style></head><body data-page="books"><header></header><main class="books-page">
<div class="books-grid">
<section class="books-panel"><h2>My collection</h2><form id="catalogue-search" class="books-row"><input id="catalogue-query" type="search" placeholder="Search RABEL by title, author or ISBN" required><button type="submit">Search</button></form><div id="catalogue-results"></div><div class="books-status" id="collection-status">Loading your books…</div><div id="books-list"></div></section>
<section class="books-panel"><h2 id="book-heading">Book details</h2><form id="book-form"><label for="book-title">Title</label><input id="book-title" required disabled><label for="book-authors">Authors</label><input id="book-authors" disabled><div class="books-row"><div><label for="book-isbn">ISBN</label><input id="book-isbn" disabled></div><div><label for="book-rating">Rating (1–5)</label><select id="book-rating" disabled><option value="">Not rated</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div></div><div class="books-row"><div><label for="book-status">Reading status</label><select id="book-status" disabled><option value="pending">Pending</option><option value="reading">Reading</option><option value="read">Read</option></select></div><label class="library-option"><input id="book-want-to-buy" type="checkbox" disabled> Want to buy</label></div><label for="book-review">Review</label><textarea id="book-review" rows="4" disabled></textarea><div class="books-actions"><button id="save-book" type="submit" disabled>Save</button><button id="delete-book" type="button" class="danger" disabled>Remove</button><button id="refresh-holdings" type="button" class="secondary" disabled>Refresh availability</button></div></form>
<h3>Availability in your libraries</h3><div id="book-holdings" class="muted">Select a book to check its copies.</div>
<hr><h3>Preferred libraries</h3><p class="muted">Choose which RABEL libraries should be checked for each book.</p><div id="library-options">Loading libraries…</div><button id="save-libraries" type="button">Save selected libraries</button><p id="books-status" class="books-status" aria-live="polite"></p></section>
</div></main></body></html>
