<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>EME Agent Console · Shopping list</title><link rel="stylesheet" href="/assets/console.css"><script src="/assets/console-auth.js" defer></script><script src="/assets/meals-family.js" defer></script><script src="/assets/shopping-list.js" defer></script></head>
<body><header><div class="header-title"><h1>EME Agent Console</h1><nav class="main-nav" aria-label="Main navigation"><a class="main-nav-link" href="/console/conversations">Conversations</a><a class="main-nav-link" href="/console/notes">Notes</a><a class="main-nav-link" href="/console/tasks">Tasks</a><a class="main-nav-link active" href="/console/meals" aria-current="page">Meals</a></nav></div><div class="header-actions"><div class="console-mode-switch" role="group" aria-label="Console layout"><a class="console-mode-link active" href="/console/conversations" aria-label="Desktop version" title="Desktop version"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg></a><a class="console-mode-link" href="/mobile/conversations" aria-label="Mobile version" title="Mobile version"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></a></div><a class="profile-link" href="/console/profile" aria-label="Profile" title="Profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></a><button class="secondary" id="logout" type="button" hidden>Sign out</button><span id="connection" class="hint">Connecting…</span></div></header>
<main class="meal-planner-page" hidden><div class="meals-header-row"><div id="meals-family-selector" class="meals-family-selector"></div><nav class="profile-section-nav meals-section-nav" aria-label="Meals"><a class="profile-section-link" href="/console/meals">Recipes</a><a class="profile-section-link" href="/console/meal-planner">Meal planner</a><a class="profile-section-link" href="/console/school-menus">School menus</a><a class="profile-section-link active" href="/console/shopping-list" aria-current="page">Shopping list</a></nav></div>
<section class="panel recipe-main shopping-list-main"><div class="shopping-list-toolbar"><div class="shopping-list-controls"><label class="shopping-list-field"><span>Starting week</span><input id="shopping-start" type="date" required></label><label class="shopping-list-field"><span>Duration</span><select id="shopping-weeks"><option value="1">1 week</option><option value="2" selected>2 weeks</option><option value="3">3 weeks</option><option value="4">4 weeks</option><option value="5">5 weeks</option><option value="6">6 weeks</option><option value="8">8 weeks</option></select></label><button id="shopping-refresh" type="button">Update list</button><button id="shopping-restore-all" class="secondary" type="button">Restore all items</button></div><div id="shopping-range" class="shopping-list-range hint" aria-live="polite"></div></div><div id="shopping-content" aria-live="polite"><p class="empty">Loading shopping list…</p></div></section></main></body></html>
