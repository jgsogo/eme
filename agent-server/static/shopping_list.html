<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>EME Agent Console · Shopping list</title><link rel="stylesheet" href="/assets/console.css"><script src="/assets/desktop-header.js" defer></script><script src="/assets/console-auth.js" defer></script><script src="/assets/meals-family.js" defer></script><script src="/assets/shopping-list.js" defer></script></head>
<body><header></header>
<main class="meal-planner-page" hidden><div class="meals-header-row"><div id="meals-family-selector" class="meals-family-selector"></div><nav class="profile-section-nav meals-section-nav" aria-label="Meals"><a class="profile-section-link" href="/console/meals">Recipes</a><a class="profile-section-link" href="/console/meal-planner">Meal planner</a><a class="profile-section-link active" href="/console/shopping-list" aria-current="page">Shopping list</a><a class="profile-section-link" href="/console/school-menus">School menus</a></nav></div>
<section class="panel recipe-main shopping-list-main"><div class="shopping-list-toolbar"><div class="shopping-list-controls"><label class="shopping-list-field"><span>Starting week</span><input id="shopping-start" type="date" required></label><label class="shopping-list-field"><span>Duration</span><select id="shopping-weeks"><option value="1" selected>1 week</option><option value="2">2 weeks</option><option value="3">3 weeks</option><option value="4">4 weeks</option><option value="5">5 weeks</option><option value="6">6 weeks</option><option value="8">8 weeks</option></select></label><button id="shopping-refresh" type="button">Update list</button><button id="shopping-restore-all" class="secondary" type="button" disabled>Restore all items</button></div><div id="shopping-range" class="shopping-list-range hint" aria-live="polite"></div></div><div id="shopping-content" aria-live="polite"><p class="empty">Loading shopping list…</p></div></section></main></body></html>
