<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>EME Agent Console · Meal planner</title><link rel="stylesheet" href="/assets/console.css"><script src="/assets/console-auth.js" defer></script><script src="/assets/meals-family.js" defer></script><script src="/assets/weekly-planner.js" defer></script></head>
<body><header><div class="header-title"><h1>EME Agent Console</h1><nav class="main-nav" aria-label="Main navigation"><a class="main-nav-link" href="/console/conversations">Conversations</a><a class="main-nav-link" href="/console/notes">Notes</a><a class="main-nav-link" href="/console/tasks">Tasks</a><a class="main-nav-link active" href="/console/meals" aria-current="page">Meals</a></nav></div><div class="header-actions"><div class="console-mode-switch" role="group" aria-label="Console layout"><a class="console-mode-link active" href="/console/conversations" aria-label="Desktop version" title="Desktop version" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg></a><a class="console-mode-link" href="/mobile/conversations" aria-label="Mobile version" title="Mobile version"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></a></div><a class="profile-link" href="/console/profile" aria-label="Profile" title="Profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></a><button class="secondary" id="logout" type="button" hidden>Sign out</button><span id="connection" class="hint">Connecting…</span></div></header>
<main hidden><div class="meals-header-row"><div id="meals-family-selector" class="meals-family-selector"></div><nav class="profile-section-nav meals-section-nav" aria-label="Meals"><a class="profile-section-link" href="/console/meals">Recipes</a><a class="profile-section-link active" href="/console/meal-planner" aria-current="page">Meal planner</a><a class="profile-section-link" href="/console/school-menus">School menus</a></nav></div>
<section class="panel recipe-main school-menu-main"><div class="planner-toolbar school-menu-toolbar"><div class="planner-week-controls"><button id="previous-month" class="secondary" type="button" aria-label="Previous month">←</button><label>Month <input id="month-date" type="month" lang="en-GB" aria-label="Select month"></label><button id="next-month" class="secondary" type="button" aria-label="Next month">→</button></div><label class="school-menu-weekends-toggle"><input id="show-weekends" type="checkbox" checked> Show weekends</label><span id="plan-status" class="hint" aria-live="polite"></span></div><div id="planner-month-view" aria-live="polite"><p class="empty">Loading meal planner…</p></div></section>
<section id="assignment-editor" class="panel assignment-editor" hidden><div class="editor-heading"><h2 id="editor-title">Plan meal</h2><button id="close-editor" class="secondary" type="button">Close</button></div><form id="assignment-form" class="recipe-form"><div class="recipe-grid"><label>Date<input id="assignment-date" type="date" required></label><label>Meal<select id="assignment-meal"><option value="lunch">Lunch</option><option value="dinner">Dinner</option></select></label></div><label>Family members<select id="assignment-participants" multiple required size="5"></select></label><label>Recipes<select id="assignment-recipes" multiple size="6"></select><span class="hint">Select one or more recipes to serve at this meal.</span></label><label>Arrangement<select id="assignment-arrangement"><option value="home">At home</option><option value="school">At school</option><option value="away">Away</option><option value="not_participating">Not participating</option></select></label><label>Notes<textarea id="assignment-notes" rows="2"></textarea></label><div class="recipe-actions"><button type="submit">Save meal</button><button id="remove-assignment" class="danger" type="button" hidden>Remove meal</button></div><p id="assignment-error" class="hint" role="status"></p></form></section></main></body></html>
