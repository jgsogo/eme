name: Format Google OAuth changes
on:
  push:
    branches:
      - feat/122-google-oauth-server-endpoints
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add agent-server/src/api/google_oauth.rs agent-server/src/lib.rs tools/google/src/oauth.rs
            git commit -m "style: format Google OAuth server integration"
            git push
          fi
